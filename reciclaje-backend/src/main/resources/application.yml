server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: reciclaje-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: America/Santiago

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:LocalDevOnlySecretKeyChangeMeInProduction2026!}
  expiration-ms: ${JWT_EXPIRATION_MS:604800000}

admin:
  initial:
    email: ${ADMIN_INITIAL_EMAIL:admin@reciclajelitoral.cl}
    name: ${ADMIN_INITIAL_NAME:Administrador General}
    password: ${ADMIN_INITIAL_PASSWORD:DevAdminPassword123!}

aws:
  profile: ${AWS_PROFILE:}
  access-key-id: ${AWS_ACCESS_KEY_ID:}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  s3:
    bucket-name: ${AWS_S3_BUCKET:reciclaje-litoral-fotos-dev}
    region: ${AWS_REGION:us-east-1}
