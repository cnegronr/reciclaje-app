services:
  # 1. Base de Datos PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: reciclaje_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # 2. Microservicio Backend (Spring Boot)
  backend:
    build:
      context: ./reciclaje-backend
      dockerfile: Dockerfile
    container_name: reciclaje_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL}
      ADMIN_INITIAL_NAME: ${ADMIN_INITIAL_NAME}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD}
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      # Montar perfil local ~/.aws para reutilizar las credenciales de aws configure en el contenedor
      - ~/.aws:/root/.aws:ro
    ports:
      - "8080:8080"

  # 3. Frontend Web App (Nginx + React SPA)
  frontend:
    build:
      context: ./reciclaje-web-poc
      dockerfile: Dockerfile
      args:
        VITE_SHOW_TEST_CREDENTIALS: ${VITE_SHOW_TEST_CREDENTIALS:-false}
        VITE_ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL}
        VITE_ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD}
    container_name: reciclaje_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
